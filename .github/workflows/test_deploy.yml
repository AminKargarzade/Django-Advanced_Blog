name: Django Project Test and Deploy

on:
  push:
    branches: [ "main", "Deployment" ]
  pull_request:
    branches: [ "main" ]

jobs:

  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Docker-Compose
      run: docker compose up -d
    - name: Run Tests
      run: docker exec backend sh -c "flake8 && pytest ."

  Deploy:
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') }} # the deploy job will run if the test job is successful
    name: Deploy
    needs: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Connect and Execute Commands
      uses: appleboy/ssh-action@master
      with:
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd ${{ secrets.SSH_PROJECT_PATH }}
          docker-compose -f docker-compose-stage.yml stop
          git pull
          docker-compose -f docker-compose-stage.yml restart
      # Add your deployment commands here, e.g., SSH into the server and pull the latest changes
      # I added the auto deploy script in the previous commit, so you can just run the script here